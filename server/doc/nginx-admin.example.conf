# admin-Soybean 脚手架 — Nginx 反代示例（非运行配置，勿不改直接上生产）
#
# 架构：前端 Vue SPA（history）静态托管 + 后端 Spring Boot API 同域反代。
# 应用默认：prod 监听 127.0.0.1:8081；管理端 JSON 统一前缀 /api/admin/**；文件预览 /upload/**。
# 前端构建：VITE_SERVICE_BASE_URL 建议同域留空或填本站根（如 https://example.com），
#           使请求走 /api/admin/...、/upload/...，由本机 Nginx 分流。
# 客户端 IP：须传 X-Real-IP=$remote_addr（ServletUtils.getIP 优先读该头；勿依赖可伪造的 XFF 最左段）。
#
# 放置：limit_req_zone 必须在 http {} 内；server 可放到 conf.d/*.conf。
# 本文件写成完整 http 片段便于阅读；实际部署请拆进现有 nginx.conf，并改：
#   server_name、root（前端 dist）、upstream 端口、HTTPS。

http {
    # 10m 约可记大量 IP；rate 按「单 IP」计，与 sys_config 的 security.loginIpLim / capIpLim 不必相同。
    # 网关层宜略宽于应用内软拦，避免正常刷新验证码先被 Nginx 429。
    limit_req_zone $binary_remote_addr zone=admin_login:10m rate=20r/m;
    limit_req_zone $binary_remote_addr zone=admin_captcha:10m rate=30r/m;

    upstream admin_backend {
        server 127.0.0.1:8081;
        keepalive 16;
    }

    # 反代到后端的公共头（登录 / 验证码 / API / 上传共用）
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      "";
    }

    server {
        listen 80;
        server_name example.com;   # 换成实际域名或内网主机名

        # 前端构建产物目录（pnpm build 后的 web/dist）
        root /var/www/admin-soybean/web/dist;
        index index.html;

        # 上传体积：须 ≥ 业务 upload.maxFileSzMb，且 ≤ 后端 spring.servlet.multipart
        client_max_body_size 100m;

        # ---------- 认证限流（路径对齐 AdminAuth / CaptchaController）----------

        # 登录：仅限 POST /api/admin/auth/login
        location = /api/admin/auth/login {
            limit_req zone=admin_login burst=5 nodelay;
            proxy_pass http://admin_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
        }

        # 验证码：GET /api/admin/auth/captchaImage
        location = /api/admin/auth/captchaImage {
            limit_req zone=admin_captcha burst=10 nodelay;
            proxy_pass http://admin_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
        }

        # ---------- 其余后端接口 / 文件流 ----------

        # 管理端全部 JSON（认证 + 业务模块，统一 /api/admin/**）
        location ^~ /api/admin/ {
            proxy_pass http://admin_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
        }

        # 上传预览/下载（UploadPreviewController /upload/{fileId}，非 /api/admin）
        location ^~ /upload/ {
            proxy_pass http://admin_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
        }

        # 后端静态资源（若仍走 Spring /static/**；前端打包资源在 dist/assets，不经此）
        location ^~ /static/ {
            proxy_pass http://admin_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Connection "";
        }

        # ---------- 前端 SPA（history 模式）----------

        location / {
            try_files $uri $uri/ /index.html;
        }

        # 超限返回 429；应用内 Redis 超限仍由后端文案 / 验证码兜底图处理
        limit_req_status 429;
    }
}
