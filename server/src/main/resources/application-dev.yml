# 开发环境（默认 spring.profiles.active=dev，见 application.yml 的 SPRING_PROFILES_ACTIVE）
server:
  port: 8085

spring:
  threads:
    virtual:
      # JDK 25 下先在开发环境验证虚拟线程与登录态、日志上下文的兼容性。
      enabled: true
  datasource:
    # 应用和历史 datetime 数据按中国本地时间处理；serverTimezone 与 app.timezone 对齐。
    url: jdbc:mysql://127.0.0.1:3306/admin_soybean?useSSL=false&allowPublicKeyRetrieval=true&useUnicode=true&characterEncoding=utf-8&serverTimezone=${app.timezone}
    username: admin_soybean
    # 请改成本地 MySQL 密码；勿把真实生产密码提交到公开仓库。
    password: change-me
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      pool-name: HikariCP
      minimum-idle: 5
      maximum-pool-size: 15
      idle-timeout: 30000
      connection-test-query: SELECT 1
      # Hikari 仅支持单条 init SQL；utf8mb4 仍由 JDBC URL characterEncoding 保证。
      # 用偏移量而非 IANA 名：本机 MySQL 未导入时区表时 SET time_zone='Asia/Shanghai' 会失败。
      # Java/Jackson/JDBC 仍读 app.timezone；此处钉死会话 NOW() 为东八区。
      connection-init-sql: SET time_zone = '+08:00'
      connection-timeout: 5000
      max-lifetime: 1800000
      auto-commit: true
  devtools:
    restart:
      enabled: true
      additional-paths: src/main
      exclude: test/**
  data:
    redis:
      # Sa-Token 整合 Redis（本地单机必需配置）。
      host: 127.0.0.1
      port: 6379
      database: 0
      # Redis 无密码可留空；有密码请填写。
      password:
      connect-timeout: 3s
      timeout: 3s
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: 3s

mybatis-plus:
  configuration:
    # 勿用 StdOutImpl；SQL 由 logging.level.com.ylmao.admin.mapper 控制
    # log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# 开发环境日志：默认安静，按需将 com.ylmao.admin.mapper 改为 debug 查看 SQL
logging:
  level:
    root: info
    com.ylmao.admin: info
    org.springframework.web: warn
    org.springframework.web.servlet.PageNotFound: error
    org.springframework.web.servlet.mvc.method.annotation.ExceptionHandlerExceptionResolver: error
    com.ylmao.admin.mapper: info

# 开发环境：启动后校验指定 Mapper statement 是否已注册（MappedStatementVerifier）。
app:
  mybatis:
    verify: true

# 开发环境：Sa-Token 日志与 Cookie 安全标记。
sa-token:
  cookie:
    # 仅 HTTPS 生效；本地 HTTP 必须 false，否则浏览器不带 Cookie。
    secure: false
  # 启动时是否打印 Sa-Token 版本字符画。
  is-print: true
  # 是否输出 Sa-Token 操作日志。
  is-log: false
  # Sa-Token 日志等级，可选 trace、debug、info、warn、error、fatal。
  log-level: trace
  # Sa-Token 日志等级数值；1=trace，2=debug，3=info，4=warn，5=error，6=fatal。
  log-level-int: 1

# 开发环境开启在线接口文档（springdoc）；生产见 application-prod.yml。
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
  show-actuator: false
